<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Taza y caja en AR</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;font-family:system-ui,sans-serif;text-align:center;background:#f6f5f2;color:#1c1c1a}
model-viewer{width:100%;height:65vh}button{font:inherit;padding:10px 18px;margin:4px;border-radius:20px;border:1px solid #2a6df4;background:#fff}
#ar{background:#2a6df4;color:#fff;border:0;position:absolute;bottom:16px;left:50%;transform:translateX(-50%)}#w{position:relative}</style></head><body>
<h1 style="font-size:1.2rem">Tu primer proyecto AR</h1><p id="d">Taza: 8 cm de diámetro × 9.5 cm de alto</p>
<div id="w"><model-viewer id="mv" src="taza.glb" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" camera-controls auto-rotate shadow-intensity="1" alt="Modelo 3D"><button slot="ar-button" id="ar">Ver en tu mesa (AR)</button></model-viewer></div>
<div><button onclick="s('taza','Taza: 8 cm de diámetro × 9.5 cm de alto')">Taza</button><button onclick="s('caja','Caja: 10 × 10 × 10 cm')">Caja</button></div>
<script>function s(n,t){document.getElementById('mv').src=n+'.glb';document.getElementById('d').textContent=t}</script></body></html>
