<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Taza AR con marcador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
body{margin:0;overflow:hidden}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px;text-align:center;color:#fff;background:linear-gradient(transparent,#000a);font-family:system-ui,sans-serif}
#ui button{font:inherit;padding:10px 18px;margin:3px;border-radius:18px;border:1px solid #fff;background:#0008;color:#fff}
#ui button.on{background:#2a6df4;border-color:#2a6df4}
#st{font-size:.85rem;margin:4px}
</style></head><body>
<div id="intro" style="position:fixed;inset:0;z-index:5;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;text-align:center;padding:24px">
<h2 style="margin:0 0 16px">Taza en AR</h2>
<button id="go" style="font:inherit;font-size:1.2rem;padding:14px 28px;border-radius:28px;border:0;background:#2a6df4;color:#fff">Iniciar cámara</button></div>
<div id="ui"><div id="st">Apunta la cámara al mouse pad.</div>
<button id="bc" class="on">Taza</button><button id="bb">Caja</button></div>
<a-scene mindar-image="autoStart:false; imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta:0.001; uiScanning:yes; uiLoading:no"
  color-space="sRGB" renderer="colorManagement:true, physicallyCorrectLights:true"
  vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
  <a-assets>
    <a-asset-item id="mCup" src="taza.glb"></a-asset-item>
    <a-asset-item id="mBox" src="caja.glb"></a-asset-item>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  <a-light type="ambient" intensity="1.2"></a-light>
  <a-light type="directional" intensity="1" position="1 2 2"></a-light>
  <a-entity id="tgt" mindar-image-target="targetIndex:0">
    <a-entity id="obj" rotation="90 0 0">
      <a-gltf-model id="cup" src="#mCup"></a-gltf-model>
      <a-gltf-model id="box" src="#mBox" visible="false"></a-gltf-model>
    </a-entity>
  </a-entity>
</a-scene>
<script>
// Ancho REAL del mouse pad en cm. Cámbialo aquí o en el link: ?w=25
const W=parseFloat(new URLSearchParams(location.search).get('w'))||25;
const s=100/W; // 1 unidad = ancho del pad; los modelos están en metros
document.getElementById('obj').setAttribute('scale',`${s} ${s} ${s}`);
const $=id=>document.getElementById(id),t=$('tgt');
$('st').textContent='Cargando… si tarda mucho, revisa el mensaje aquí.';
fetch('targets.mind',{method:'HEAD'}).then(r=>{if(!r.ok)$('st').textContent='Falta el archivo targets.mind junto al index.html'}).catch(()=>{});
const sc=document.querySelector('a-scene');
sc.addEventListener('arReady',()=>$('st').textContent='Cámara lista. Apunta al mouse pad.');
sc.addEventListener('arError',()=>$('st').textContent='Error al iniciar la cámara o el archivo targets.mind.');
$('go').onclick=async()=>{
  try{const f=document.documentElement.requestFullscreen({navigationUI:'hide'});if(f&&f.catch)f.catch(()=>{});}catch(e){}
  $('go').disabled=true;$('st').textContent='Iniciando cámara…';
  try{await sc.systems['mindar-image-system'].start();$('intro').style.display='none';}
  catch(e){$('st').textContent='Error al iniciar: '+(e&&e.message||e);$('go').disabled=false;}
};
window.onerror=m=>{$('st').textContent='Error: '+m;};
t.addEventListener('targetFound',()=>$('st').textContent='Mouse pad detectado ✔ (ancho '+W+' cm)');
t.addEventListener('targetLost',()=>$('st').textContent='Vuelve a apuntar al mouse pad.');
function pick(c){$('cup').setAttribute('visible',c);$('box').setAttribute('visible',!c);
$('bc').className=c?'on':'';$('bb').className=c?'':'on';}
$('bc').onclick=()=>pick(true);$('bb').onclick=()=>pick(false);
</script></body></html>
